apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshop-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sufiyannadeem/tws-e-commerce-app.git    # Replace it with your forked repo
    targetRevision: master
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc  # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
