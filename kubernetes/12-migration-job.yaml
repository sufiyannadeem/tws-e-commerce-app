apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: easyshop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: migration
          image: sufiyannadeem/easyshop-migration:18
          imagePullPolicy: Always
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-service:27017/easyshop"
      restartPolicy: OnFailure
